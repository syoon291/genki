<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>genki</title>
  <meta name="description" content="A personal nutrition and workout tracker: calories, protein, weigh-ins and lifts, kept on your phone.">
  <meta name="theme-color" content="#f4f6f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121612" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="genki">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 class="brand"><span class="dot" aria-hidden="true"></span>genki</h1>
    <button id="data-btn" class="icon-btn" type="button" aria-label="Data and backup" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="today" aria-label="Today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
    <button type="button" data-tab="nutrition" aria-label="Nutrition"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-1.5-2.5-6-2.5-7 1.5S6.5 20 9 20c1.2 0 1.8-.6 3-.6s1.8.6 3 .6c2.5 0 5-7.5 4-11.5S13.5 4.5 12 7zM12 7c0-2 1-3.5 3-4"/></svg><span>Nutrition</span></button>
    <button type="button" data-tab="workouts" aria-label="Workouts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Workouts</span></button>
  </nav>

  <dialog id="data-dialog" aria-labelledby="data-title">
    <div class="sheet" id="data-sheet"></div>
  </dialog>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript><p class="wrap">genki needs JavaScript turned on.</p></noscript>
  <script src="app.js" type="module"></script>
</body>
</html>
